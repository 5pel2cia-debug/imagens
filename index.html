<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cavalaria</title>
    <link rel="icon" href="favicon-96x96.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        #conteudo {
            height: 100%;
            width: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .mensagem {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 2rem;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="conteudo">
        <div class="mensagem">
            <p>Carregando o script...</p>
        </div>
    </div>

    <script>
        const BASE_URL = 'https://script.google.com/macros/s/AKfycbwZnyN-qG5vClvUH0CZXFvqx7vhrDS_fwYjWQjPnbgFiycxsr3e2WkJjL8czs1ouuKY7Q/exec';
        const BASE_URL2 = 'https://script.google.com/macros/s/AKfycbzov692VBDnQFqlTJutIpmTjQm0oHN7dYqq3aFl4Yba8-rRcnpqsO1bZP4p2XjQtHBJyw/exec';
        
        const MENU_URL = 'https://script.google.com/macros/s/AKfycbzov692VBDnQFqlTJutIpmTjQm0oHN7dYqq3aFl4Yba8-rRcnpqsO1bZP4p2XjQtHBJyw/exec?funcao=menu';
        const DR_URL = 'https://script.google.com/macros/s/AKfycbzov692VBDnQFqlTJutIpmTjQm0oHN7dYqq3aFl4Yba8-rRcnpqsO1bZP4p2XjQtHBJyw/exec?funcao=dr';
        const MENU_URL2 = 'https://script.google.com/macros/s/AKfycby9ko-8aCrNG3nhu8uT8j1xfcN9gmNW1-vEZr18crj5/exec?funcao=menu';

        const queryString = window.location.search;
        const container = document.getElementById('conteudo');

        // ========== 1. Listener para receber a mensagem do iframe e fazer o download ==========
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'DOWNLOAD_IMAGE') {
                const { url, filename } = event.data.payload;
                console.log('📸 Download solicitado pelo iframe:', filename);
        
                // Cria um elemento flutuante (overlay) com botão
                const overlay = document.createElement('div');
                overlay.style.position = 'fixed';
                overlay.style.bottom = '20px';
                overlay.style.left = '0';
                overlay.style.right = '0';
                overlay.style.backgroundColor = '#1a237e';
                overlay.style.color = 'white';
                overlay.style.padding = '16px';
                overlay.style.textAlign = 'center';
                overlay.style.zIndex = '9999999999999999999999999';
                overlay.style.fontFamily = 'sans-serif';
                overlay.style.boxShadow = '0 -2px 10px rgba(0,0,0,0.2)';
                overlay.innerHTML = `
                    <p style="margin: 0 0 10px 0;">Clique no botão para salvar a imagem:</p>
                    <button id="btn-salvar-imagem" style="background: #4caf50; border: none; padding: 10px 20px; border-radius: 40px; color: white; font-size: 16px; cursor: pointer;">💾 Salvar Imagem</button>
                    <button id="btn-cancelar" style="background: #f44336; border: none; padding: 10px 20px; border-radius: 40px; color: white; font-size: 16px; cursor: pointer; margin-left: 10px;">Cancelar</button>
                `;
                document.body.appendChild(overlay);
        
                const salvarBtn = overlay.querySelector('#btn-salvar-imagem');
                const cancelarBtn = overlay.querySelector('#btn-cancelar');
        
                const finalizar = () => {
                    if (overlay && overlay.parentNode) overlay.remove();
                };
        
                salvarBtn.addEventListener('click', () => {
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(url), 100);
                    finalizar();
                });
        
                cancelarBtn.addEventListener('click', () => {
                    URL.revokeObjectURL(url);
                    finalizar();
                });
            }
        });

        // ========== 2. Função para criar o iframe (mantida igual) ==========
        function criarIframe(url) {
            const iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.title = "Cavalaria";
            iframe.setAttribute('allow', 
                'cookies; ' +
                'storage-access-by-user-activation; ' +
                'cross-origin-isolated; ' +
                'same-origin-allow-popups; ' +
                'geolocation; microphone; camera; midi; encrypted-media'
            );
            iframe.setAttribute('sandbox', 
                'allow-same-origin ' +
                'allow-scripts ' +
                'allow-popups ' +
                'allow-forms ' +
                'allow-storage-access-by-user-activation'
            );
            return iframe;
        }

        // ========== 3. Carrega o conteúdo correto ==========
        function atualizarTituloPorHash() {
            let hash = window.location.hash.substring(1);
            if (hash) {
                try {
                    document.title = decodeURIComponent(hash);
                    console.log('📌 Título definido via hash:', document.title);
                } catch(e) {}
            }
        }

        window.addEventListener('hashchange', atualizarTituloPorHash);
        atualizarTituloPorHash();

        if (queryString) {
            const parametros = new URLSearchParams(queryString);
            if(parametros.get('funcao') === 'dr'){
                const iframe = criarIframe(DR_URL);
                container.innerHTML = '';
                container.appendChild(iframe);
            } else {
                const urlCompleta = BASE_URL + queryString;
                const iframe = criarIframe(urlCompleta);
                container.innerHTML = '';
                container.appendChild(iframe);
            }
        } else {
            const iframe = criarIframe(MENU_URL);
            container.innerHTML = '';
            container.appendChild(iframe);
        }
    </script>
</body>
</html>
